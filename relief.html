<h1>スマホ各社が渡す救済手段</h1>
<p>携帯各社は、ホームレス状態にある人へ次の手段を渡す（憲章上の要請。既存法令の上書きではない）。</p>
<ul>
<li>不要手機・再利用端末の提供</li>
<li>緊急通話のできるプリペイド</li>
<li>無料Wi-Fi / 充電スポットの地図</li>
<li>宿泊・食事・医療の紹介ディレクトリ</li>
</ul>
<p class="note">対象例: NTTドコモ / au / 軟銀 / 楽天モバイル。現実の通話は各社の公式窓口へ。</p>
