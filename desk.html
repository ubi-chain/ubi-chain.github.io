<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UBICHAIN 機関協議デスク</title>
  <meta name="theme-color" content="#020408" />
  <style>
    :root { --bg:#0b1016; --fg:#d7e6ee; --dim:#7a9aaa; --accent:#00d4ff; --border:#1a2b38; --side:#071017; --msg:#101820; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.45 "Hiragino Sans",system-ui,sans-serif; }
    .app { display:grid; grid-template-columns: 168px 1fr; height:100dvh; }
    aside { background:var(--side); border-right:1px solid var(--border); padding:12px 8px; overflow:auto; }
    aside a { display:block; color:var(--dim); text-decoration:none; padding:8px 10px; border-radius:6px; font:12px/1.2 ui-monospace,monospace; }
    aside a.on { background:#12202a; color:var(--accent); }
    main { display:flex; flex-direction:column; min-width:0; }
    header { padding:10px 14px; border-bottom:1px solid var(--border); font:12px/1.3 ui-monospace,monospace; color:var(--accent); }
    .note { padding:8px 14px; color:var(--dim); font-size:12px; }
    #log { flex:1; overflow:auto; padding:12px 14px; }
    .m { background:var(--msg); border:1px solid var(--border); margin:0 0 8px; padding:8px 10px; border-radius:8px; }
    .m b { color:var(--accent); font-size:11px; }
    form { display:flex; gap:8px; padding:10px; border-top:1px solid var(--border); }
    input,button { height:40px; border:1px solid var(--border); }
    input { flex:1; background:#0a1218; color:var(--fg); padding:0 10px; }
    button { background:var(--accent); color:#020408; font-weight:700; padding:0 14px; }
    @media (max-width:720px) { .app { grid-template-columns: 1fr; } aside { display:flex; gap:4px; overflow:auto; white-space:nowrap; } }
  </style>
</head>
<body>
  <div class="app">
    <aside id="ch"></aside>
    <main>
      <header id="title">#jp-110</header>
      <p class="note">協議用の試作デスクです。法と各国の著書（憲法・法令）の範囲内だけ。110/911 の代替ではありません。投稿はこの端末にだけ残ります。</p>
      <div id="log"></div>
      <form id="f">
        <input id="who" maxlength="24" placeholder="機関名 / 表示名" />
        <input id="text" maxlength="280" placeholder="協議メッセージ" />
        <button type="submit">送信</button>
      </form>
    </main>
  </div>
  <script>
    const channels = [
      ["general", "#general 国際"],
      ["jp-110", "#jp-110 日本警察"],
      ["jp-119", "#jp-119 消防救急"],
      ["us-911", "#us-911"],
      ["gb-999", "#gb-999"],
      ["eu-112", "#eu-112"],
      ["kr-112", "#kr-112"],
      ["watch", "#watch サービス監視"]
    ];
    let cur = "jp-110";
    const seed = {
      "general": [["憲章", "権限は各国の法と著書に従う。プロトコルが主権を上書きしない。"]],
      "jp-110": [["副管理", "例：110 を日本の副管理者番号とする。実際の通報は現行の110へ。"]],
      "watch": [["監視", "警察機構はこのサービス公開面の乱用監視を受ける。私生活の監聴ではない。"]]
    };
    function key(c){ return "ubichain.desk." + c; }
    function load(c){
      try { return JSON.parse(localStorage.getItem(key(c))) || seed[c] || []; }
      catch(e){ return seed[c] || []; }
    }
    function render(){
      document.getElementById("title").textContent = channels.find(x => x[0]===cur)[1];
      document.querySelectorAll("aside a").forEach(a => a.classList.toggle("on", a.dataset.c===cur));
      const log = document.getElementById("log");
      log.innerHTML = load(cur).map(([w,t]) => "<div class='m'><b>"+w+"</b><div>"+t+"</div></div>").join("");
      log.scrollTop = log.scrollHeight;
    }
    const nav = document.getElementById("ch");
    nav.innerHTML = '<a href="./index.html">← UBICHAIN</a>' + channels.map(([id,label]) => '<a href="#" data-c="'+id+'">'+label+'</a>').join("");
    nav.onclick = (e) => {
      const a = e.target.closest("a[data-c]");
      if(!a) return;
      e.preventDefault();
      cur = a.dataset.c;
      render();
    };
    document.getElementById("f").onsubmit = (e) => {
      e.preventDefault();
      const w = document.getElementById("who").value.trim() || "未記名機関";
      const t = document.getElementById("text").value.trim();
      if(!t) return;
      const rows = load(cur); rows.push([w,t]);
      localStorage.setItem(key(cur), JSON.stringify(rows.slice(-80)));
      document.getElementById("text").value = "";
      render();
    };
    render();
  </script>
</body>
</html>
