    * { box-sizing: border-box; }

    nav.dock a { flex:1; height:44px; display:grid; place-items:center; color:var(--dim); text-decoration:none; font:10px/1 ui-monospace,monospace; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
    .tile { min-height:44px; border:1px solid var(--border); background:var(--surface); color:var(--fg); display:grid; place-items:center; font:11px/1.2 ui-monospace,monospace; text-decoration:none; }
    p { color:var(--dim); }
    .note { font:11px/1.5 ui-monospace,monospace; color:var(--muted); }
