<h1>司法公約（種）</h1>
<p>国家資格・医療・学校を無料にする場合、既に払い終えた世代への補償もされ、努力も対価として戻す。</p>
<p>生まれつきの不幸により報われなかった者も状況により救済する。</p>
<p>これは事の善悪にとらわれない。現行法令の代替ではない。</p>
<ul>
<li>無料化と世代間補償の同時設計</li>
<li>努力への対価返還</li>
<li>生まれつき不幸への状況的救済</li>
</ul>
<p class="note">経済学習サイクル 5 と同期。費用の購入はしない。</p>
